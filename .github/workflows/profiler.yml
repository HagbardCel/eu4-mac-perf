name: Portable profiler correctness
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install -r benchmark/requirements-test.txt
      - run: >
          python -m compileall -q
          benchmark analysis tooling reverse_engineering
          oracle automation campaigns reconstruction_trace tests
      - run: PYTHONPATH=benchmark:. python -m unittest discover -s tests
      - name: DSH plugin tests
        run: npm test --prefix dsh/eu4-goal-plugin
      - run: PYTHONPATH=benchmark python benchmark/eu4_frame_model.py verify-evidence results/20261003T210202Z-intrusive-diagnostic --profile intrusive_complete_v1
      - run: python tooling/common/check_forbidden_tracked_paths.py
      - run: python tooling/common/check_oracle_bundle.py
      - run: python tooling/common/check_oracle_receipt.py
      - run: >
          python tooling/common/check_doc_links.py --strict
          README.md docs
          analysis/reconstruction
          results/README.md
          reverse_engineering/README.md
          experiments/README.md
          patches/README.md
          measurements/INDEX.md
          automation/README.md
          campaigns/eu4-re2-pilot/README.md
          campaigns/eu4-index-buffer/README.md
          AGENTS.md
          dsh/README.md
          benchmark/README.md
          analysis/README.md
      - run: git diff --check "${{ steps.base.outputs.sha }}" HEAD
# Proprietary EU IV symbols, Rosetta, CGL, overhead, and live release gates are local evidence.
