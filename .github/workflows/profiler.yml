name: Portable profiler correctness
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install -r benchmark/requirements-test.txt
      - run: python -m compileall -q benchmark analysis tooling
      - run: PYTHONPATH=benchmark:. python -m unittest discover -s tests
      - run: PYTHONPATH=benchmark python benchmark/eu4_frame_model.py verify-evidence results/20261003T210202Z-intrusive-diagnostic --profile intrusive_complete_v1
      - run: python tooling/common/check_forbidden_tracked_paths.py
      - run: |
          python tooling/common/check_doc_links.py --strict \
            README.md docs/status.md docs/roadmap.md docs/README.md docs/conventions.md \
            docs/findings/README.md docs/investigations/README.md docs/decisions/README.md \
            docs/reference/profiler-and-benchmark-operations.md results/README.md \
            reverse_engineering/README.md experiments/README.md patches/README.md measurements/INDEX.md
      - run: python tooling/common/check_doc_links.py --baseline tooling/common/doc_link_baseline.json --legacy-root docs
      - run: python tooling/common/check_legacy_tree_scope.py "${{ steps.base.outputs.sha }}" HEAD
      - run: git diff --check "${{ steps.base.outputs.sha }}" HEAD
# Proprietary EU IV symbols, Rosetta, CGL, overhead, and live release gates are local evidence.
